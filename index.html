<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hambourg — Guide POI</title>
<meta name="description" content="Carte interactive des lieux incontournables de Hambourg, avec géolocalisation en temps réel et lecture audio des descriptions.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16232F">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hambourg POI">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  :root{
    --navy:#16232F;
    --sand:#F3ECE0;
    --sand-deep:#E4D9C6;
    --ink:#1B1B18;
    --white:#FFFFFF;
    --sheet-collapsed:70px;
    --sheet-expanded:68vh;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:var(--sand);
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible, a:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
  ul{list-style:none;margin:0;padding:0;}

  #app{position:fixed;inset:0;overflow:hidden;}
  #app-loading{
    position:absolute;inset:0;z-index:3000;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .25s ease;
  }
  #app-loading.hidden{opacity:0;pointer-events:none;}
  .app-loading-mark{
    font-size:34px;color:var(--white);
    animation:app-loading-pulse 1.3s ease-in-out infinite;
  }
  @keyframes app-loading-pulse{
    0%, 100%{ opacity:.45; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .app-loading-mark{animation:none;}
  }
  #map{position:absolute;inset:0;z-index:1;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:500;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
    background:linear-gradient(180deg, rgba(22,35,47,.92) 0%, rgba(22,35,47,.55) 70%, rgba(22,35,47,0) 100%);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:8px;color:var(--white);text-align:left;cursor:pointer;}
  .brand-mark{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
  .brand-text{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;line-height:1.1;font-size:15px;text-transform:uppercase;}
  .brand-text small{display:block;font-family:'Work Sans',sans-serif;font-weight:400;letter-spacing:.02em;font-size:11px;opacity:.85;text-transform:none;}

  .top-actions, .left-group{
    display:flex;align-items:center;gap:2px;
    pointer-events:auto;
    background:rgba(255,253,248,.16);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;
    padding:6px;
  }
  .left-group{padding-right:14px;gap:6px;}

  #locate-btn, #settings-btn, #city-btn{
    width:36px;height:36px;border-radius:50%;
    background:transparent;color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    transition:transform .15s, color .15s;
  }
  #locate-btn.active{color:#6FA0FF;}
  #locate-btn:active, #settings-btn:active, #city-btn:active{transform:scale(.88);}

  /* ---------- Filter chips ---------- */
  #filters{
    position:absolute;top:74px;left:0;right:0;z-index:500;
    display:flex;gap:8px;padding:2px 16px 10px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:999px;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    font-size:12.5px;font-weight:500;letter-spacing:.01em;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .chip .chip-glyph{font-size:13px;line-height:1;}
  .chip.active{background:var(--navy);color:var(--white);}

  /* ---------- Route slider (vertical, côté gauche) ---------- */
  #route-slider-wrap{
    position:absolute;left:12px;top:130px;z-index:500;
    width:44px;
    background:rgba(255,255,255,.94);
    border-radius:14px;
    padding:12px 4px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .route-slider-label-v{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--navy);
    white-space:nowrap;
  }
  .route-slider-track-v{
    position:relative;width:100%;height:210px;
    display:flex;justify-content:center;
  }
  #route-slider{
    -webkit-appearance:none;appearance:none;
    position:absolute;top:50%;left:50%;
    width:210px;height:3px;border-radius:2px;
    background:var(--sand-deep);outline:none;margin:0;
    transform:translate(-50%,-50%) rotate(90deg);
  }
  #route-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
    background:transparent;cursor:grab;
  }
  #route-slider::-moz-range-thumb{
    width:28px;height:28px;border-radius:50%;
    background:transparent;border:none;cursor:grab;
  }
  #route-slider::-moz-range-track{background:transparent;}
  .route-walker{
    position:absolute;left:50%;top:0;
    transform:translate(-50%,-50%) scaleX(-1);
    font-size:28px;pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));
  }
  .route-slider-ticks-v{
    position:absolute;left:100%;top:0;height:100%;margin-left:5px;
    display:flex;flex-direction:column;justify-content:space-between;
    font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;
    color:#8a8478;letter-spacing:.02em;
  }
  .route-clear-btn{
    font-size:10.5px;color:#8a8478;font-weight:600;
    padding:2px 4px;line-height:1.3;
  }
  .route-clear-btn.hidden{display:none;}

  /* ---------- Toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:calc(var(--sheet-collapsed) + 18px);
    transform:translateX(-50%);
    background:var(--navy);color:var(--white);
    padding:10px 16px;border-radius:8px;font-size:13px;
    max-width:86%;text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    z-index:900;transition:opacity .25s, transform .25s;
  }
  .toast.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(6px);}

  /* ---------- Start point bar ---------- */
  .start-point-bar{
    position:absolute;left:50%;bottom:calc(var(--sheet-collapsed) + 18px);
    z-index:950;
    width:auto;max-width:240px;
    transform:translateX(-50%);
    background:var(--white);border-radius:12px;
    padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:opacity .2s, transform .2s;
  }
  .start-point-bar.hidden{opacity:0;pointer-events:none;transform:translate(-50%, 8px);}
  .start-point-bar span{font-size:13px;color:var(--ink);font-weight:500;text-align:center;}
  .start-point-actions{display:flex;gap:8px;justify-content:center;width:100%;}
  .start-point-actions button{
    flex:1 1 0;padding:8px 10px;border-radius:8px;
    font-size:12.5px;font-weight:600;
  }
  #start-point-confirm{background:var(--navy);color:var(--white);}
  #start-point-cancel{background:var(--sand);color:var(--ink);}

  /* ---------- Center flag (mode positionnement par déplacement de carte) ---------- */
  .center-flag{
    position:absolute;left:50%;top:50%;z-index:1100;
    transform:translate(-50%,-100%);
    pointer-events:none;font-size:30px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .center-flag.hidden{display:none;}

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:600;
    height:var(--sheet-expanded);
    background:var(--white);
    border-radius:18px 18px 0 0;
    box-shadow:0 -6px 22px rgba(0,0,0,.25);
    transform:translateY(calc(var(--sheet-expanded) - var(--sheet-collapsed)));
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;
  }
  .sheet.expanded{transform:translateY(0);}

  .sheet-handle{
    height:var(--sheet-collapsed);
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    width:100%;
  }
  .handle-bar{width:38px;height:4px;border-radius:2px;background:var(--sand-deep);margin-bottom:4px;}
  .handle-label{
    font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--navy);
  }
  .handle-sub{font-size:11px;color:#8a8478;}

  .sheet-body{flex:1 1 auto;overflow-y:auto;padding:0 18px 24px;}

  /* ---- List ---- */
  #poi-list li{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 0;
    border-bottom:1px solid var(--sand-deep);
    cursor:pointer;
  }
  #poi-list li .pin-mini{
    flex:0 0 auto;width:30px;height:30px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
    margin-top:2px;box-shadow:0 1px 4px rgba(0,0,0,.25);border:1.5px solid var(--white);
  }
  #poi-list li .pin-mini span{transform:rotate(45deg);font-size:13px;}
  #poi-list li .li-text{flex:1 1 auto;min-width:0;}
  .thumb-slot{flex:0 0 auto;}
  .poi-thumb{
    display:block;width:50px;height:50px;border-radius:10px;object-fit:cover;
    box-shadow:0 1px 4px rgba(0,0,0,.25);border:1.5px solid var(--white);
  }
  #poi-list li .li-text h3{margin:2px 0 3px;font-size:15.5px;font-weight:600;letter-spacing:.01em;}
  #poi-list li .li-text p{margin:0;font-size:12.5px;line-height:1.4;color:#4a4640;}
  #poi-list li .li-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .empty-hint{padding:22px 0;text-align:center;color:#8a8478;font-size:13px;}

  /* ---- Stamp badge ---- */
  .stamp{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size:10px;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;
    padding:2px 8px;border-radius:3px;
    border:1.5px solid currentColor;
    transform:rotate(-2deg);
  }
  .interest-tag{
    font-family:'Oswald',sans-serif;
    font-size:10.5px;font-weight:600;
    letter-spacing:.04em;
  }
  .listen-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 12px;border-radius:999px;
    background:var(--navy);color:var(--white);
    font-size:11.5px;font-weight:600;letter-spacing:.03em;
    margin-left:auto;
    transition:background .15s;
  }
  .listen-btn.active{background:#0B3D1F;}
  .listen-btn .icon{font-size:11px;}

  .audio-controls{
    display:flex;gap:16px;
    margin:12px 0 4px;padding:12px 14px;
    background:var(--sand);border-radius:10px;
  }
  .audio-controls .ctrl{flex:1 1 0;display:flex;flex-direction:column;gap:4px;}
  .audio-controls label{
    display:flex;justify-content:space-between;
    font-family:'Oswald',sans-serif;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--navy);
  }
  .audio-controls label span.val{color:#8a8478;text-transform:none;font-family:'Work Sans',sans-serif;font-size:11px;}
  .audio-controls input[type=range]{
    accent-color:var(--navy);width:100%;height:22px;
  }

  .link-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
  .link-btn{
    flex:1 1 auto;text-align:center;
    padding:9px 12px;border-radius:8px;
    border:1.5px solid var(--navy);color:var(--navy);
    font-size:12.5px;font-weight:600;letter-spacing:.02em;
    text-decoration:none;background:transparent;
  }
  .link-btn:active{background:var(--sand-deep);}

  .city-list{list-style:none;margin:4px 0 0;padding:0;}
  .city-item{
    display:flex;align-items:center;gap:8px;
    padding:12px 4px;border-bottom:1px solid var(--sand-deep);
    cursor:pointer;
  }
  .city-item .city-name{flex:1 1 auto;font-weight:600;font-size:15px;}
  .city-item.active .city-name{color:var(--navy);}
  .city-item.active .city-name::before{content:"✓ ";}
  .city-item .city-count{font-size:11.5px;color:#8a8478;}
  .city-remove{
    width:26px;height:26px;border-radius:50%;
    background:var(--sand);color:#8a5a2b;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }

  /* ---- Centered popup (POI detail + settings) ---- */
  .modal-overlay{
    position:fixed;inset:0;z-index:2000;
    background:rgba(15,20,26,.58);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-card{
    position:relative;
    background:var(--white);
    border-radius:16px;
    width:100%;max-width:440px;max-height:82vh;
    overflow-y:auto;
    padding:24px 20px 22px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  .modal-close{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:50%;
    background:var(--sand);color:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;
  }
  .modal-card h2{font-size:21px;margin:4px 30px 8px 0;letter-spacing:.01em;}
  .modal-card h2.section-title{font-size:16px;margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--sand-deep);}
  .city-item-online .city-count{color:#5B4B8A;font-weight:600;}
  .local-delete-btn{font-size:16px;padding:4px 6px;margin-left:6px;}
  .modal-card .desc{font-size:14.5px;line-height:1.65;color:#332f2a;margin:0;}
  .modal-card .coords{
    margin-top:14px;font-size:11.5px;color:#8a8478;font-family:'Oswald',sans-serif;letter-spacing:.04em;
  }
  .modal-card .li-tags{margin-bottom:8px;}
  .modal-card .audio-controls{margin-top:0;}

  .segmented{
    display:flex;background:var(--sand);border-radius:9px;padding:3px;margin:4px 0 6px;
  }
  .seg-btn{
    flex:1 1 0;padding:8px 6px;border-radius:7px;
    font-size:12.5px;font-weight:600;color:#8a8478;
    transition:background .15s, color .15s;
  }
  .seg-btn.active{background:var(--white);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15);}

  .city-list{margin:4px 0 14px;}
  .city-item{
    display:flex;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--sand-deep);
    cursor:pointer;
  }
  .city-item:last-child{border-bottom:none;}
  .city-item.active .city-name{color:var(--navy);font-weight:700;}
  .city-name{flex:1 1 auto;font-size:15px;font-weight:500;}
  .city-count{font-size:12px;color:#8a8478;}
  .city-check{color:#0B3D1F;font-weight:700;}
  .modal-hint{margin:10px 0 0;font-size:12px;color:#8a8478;line-height:1.5;}
  .token-notice{
    margin:16px 0 0;padding-top:14px;border-top:1px solid var(--sand-deep);
    font-size:11.5px;color:#8a8478;line-height:1.6;
  }
  .token-notice a{color:var(--navy);word-break:break-all;}
  label.link-btn{display:block;cursor:pointer;}

  /* ---------- Leaflet marker overrides ---------- */
  .poi-marker{background:transparent;border:none;}
  .pin{
    width:34px;height:34px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    border:2px solid var(--sand);
  }
  .pin span{transform:rotate(45deg);font-size:15px;}
  .pin.blink{animation:pin-blink .55s ease-in-out infinite;}
  @keyframes pin-blink{
    0%, 100%{ transform:rotate(-45deg) scale(1); box-shadow:0 2px 6px rgba(0,0,0,.4); }
    50%{ transform:rotate(-45deg) scale(1.45); box-shadow:0 0 0 10px rgba(255,255,255,.55), 0 2px 10px rgba(0,0,0,.5); }
  }
  @media (prefers-reduced-motion: reduce){
    .pin.blink{animation:none;}
  }

  .route-stop{background:transparent;border:none;}
  .route-stop-num{
    display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;
    background:var(--navy);color:var(--white);
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;
    border:2px solid var(--white);box-shadow:0 1px 4px rgba(0,0,0,.4);
  }

  .start-flag-marker{background:transparent;border:none;}
  .start-flag{
    font-size:28px;line-height:1;display:block;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
    cursor:grab;
  }

  .user-marker{background:transparent;border:none;}
  .user-dot{
    position:relative;display:block;width:14px;height:14px;
    background:#2F6FED;border:2px solid var(--white);border-radius:50%;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .ping{
    position:absolute;inset:-9px;border-radius:50%;
    border:2px solid #2F6FED;
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.35);opacity:.9;}
    100%{transform:scale(2.4);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .ping{animation:none;display:none;}
    .sheet{transition:none;}
  }

  .leaflet-control-attribution{font-size:10px;}

  @media (min-width:640px){
    .sheet{left:50%;right:auto;width:420px;transform:translate(-50%, calc(var(--sheet-expanded) - var(--sheet-collapsed)));border-radius:18px 18px 0 0;}
    .sheet.expanded{transform:translate(-50%, 0);}
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="app-loading"><span class="app-loading-mark">⚓</span></div>

  <header id="topbar">
    <div class="left-group">
      <button id="city-btn" aria-label="Changer de ville">🌐</button>
      <div class="brand" id="brand-label">
        <span class="brand-text" id="brand-text">Hambourg</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="settings-btn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="locate-btn" aria-label="Afficher ma position en temps réel">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="23" y2="12"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="filters" aria-label="Filtrer par thème"></nav>

  <div id="route-slider-wrap" aria-label="Durée du parcours">
    <div id="route-slider-label" class="route-slider-label-v">2h</div>
    <div class="route-slider-track-v">
      <input type="range" id="route-slider" min="60" max="240" step="15" value="120">
      <span id="route-walker" class="route-walker">🚶</span>
      <div class="route-slider-ticks-v"><span>1h</span><span>2h</span><span>3h</span><span>4h</span></div>
    </div>
    <button id="route-clear-btn" class="route-clear-btn hidden" aria-label="Effacer le parcours">✕</button>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="center-flag" class="center-flag hidden"><span>🚩</span></div>

  <div id="start-point-bar" class="start-point-bar hidden">
    <span id="start-point-text">Partir d'ici pour ton parcours ?</span>
    <div class="start-point-actions">
      <button id="start-point-confirm">Confirmer</button>
      <button id="start-point-cancel">Annuler</button>
    </div>
  </div>

  <section id="sheet" class="sheet collapsed" aria-label="Liste des lieux visibles à l'écran">
    <button id="sheet-handle" class="sheet-handle" aria-expanded="false">
      <span class="handle-bar"></span>
      <span class="handle-label" id="handle-label">0 lieu visible</span>
      <span class="handle-sub" id="handle-sub">Clair → foncé = intérêt croissant</span>
    </button>

    <div class="sheet-body">
      <ul id="poi-list"></ul>
    </div>
  </section>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var catMeta = {
    patrimoine:{ label:"Patrimoine", color:"#A6472E", glyph:"🏛" },
    culture:   { label:"Culture",    color:"#3E747A", glyph:"🎨" },
    fluvial:   { label:"Fluvial",    color:"#16232F", glyph:"🌊" },
    nature:    { label:"Nature",     color:"#5C7A52", glyph:"🌳" },
    shopping:  { label:"Shopping",   color:"#A8791E", glyph:"🛍" },
    panorama:  { label:"Point de vue", color:"#5B4B8A", glyph:"🔭" }
  };

  function interestLabel(interest){
    if(interest >= 5) return "Incontournable";
    if(interest === 4) return "Vivement recommandé";
    if(interest === 3) return "Recommandé";
    return "À voir si vous avez le temps";
  }


  /* ---------------- Registre des villes ---------------- */
  var CITY_STORAGE_KEY = 'hamburgPoiApp:cities';
  var ACTIVE_CITY_KEY = 'hamburgPoiApp:activeCity';

  var cityRegistry = {};
  var onlineManifest = {}; // slug -> {file, city} : catalogue en ligne, pas encore téléchargé
  var activeCitySlug = 'hambourg';

  function slugify(str){
    return String(str).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'ville';
  }

  function persistCities(){
    var toSave = {};
    Object.keys(cityRegistry).forEach(function(slug){
      if(!cityRegistry[slug].builtin){ toSave[slug] = cityRegistry[slug]; }
    });
    try{ localStorage.setItem(CITY_STORAGE_KEY, JSON.stringify(toSave)); } catch(e){}
  }

  function loadPersistedCities(){
    try{
      var raw = localStorage.getItem(CITY_STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      Object.keys(saved).forEach(function(slug){ cityRegistry[slug] = saved[slug]; });
    } catch(e){ /* données corrompues, on ignore */ }
  }
  loadPersistedCities();

  try{
    var savedActive = localStorage.getItem(ACTIVE_CITY_KEY);
    if(savedActive){ activeCitySlug = savedActive; }
  } catch(e){}

  var pois = [];

  var interestValues = [1, 5];
  var interestMin = 1;
  var interestMax = 5;

  function colorForInterest(interest){
    var t = (interestMax === interestMin) ? 1 : (interest - interestMin) / (interestMax - interestMin);
    var light = [197,178,133]; // #C5B285 — moutarde visible (ancien niveau 3, pas trop pâle)
    var dark  = [26,21,12];    // #1A150C — quasi noir
    var r = Math.round(light[0] + (dark[0]-light[0])*t);
    var g = Math.round(light[1] + (dark[1]-light[1])*t);
    var b = Math.round(light[2] + (dark[2]-light[2])*t);
    return 'rgb('+r+','+g+','+b+')';
  }

  /* ---------------- Map init ---------------- */
  var map = L.map('map', { zoomControl:false, attributionControl:true })
    .setView([53.567, 9.965], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.control.scale({ position:'bottomleft', metric:true, imperial:false, maxWidth:120 }).addTo(map);

  var markers = {};

  function pinIcon(poi){
    var meta = catMeta[poi.cat];
    var bg = colorForInterest(poi.interest);
    return L.divIcon({
      className:'poi-marker',
      html:'<span class="pin" style="background:'+bg+'"><span>'+meta.glyph+'</span></span>',
      iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-30]
    });
  }

  function createMarkers(){
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    pois.forEach(function(poi){
      var m = L.marker([poi.lat, poi.lng], { icon: pinIcon(poi) }).addTo(map);
      m.on('click', function(){ openDetail(poi.id); });
      markers[poi.id] = m;
    });
  }

  /* ---------------- Filters ---------------- */
  var filtersEl = document.getElementById('filters');
  var allChip = document.createElement('button');
  allChip.className = 'chip active';
  allChip.dataset.cat = 'all';
  allChip.innerHTML = '<span class="chip-glyph">✺</span>Tous';
  filtersEl.appendChild(allChip);

  Object.keys(catMeta).forEach(function(cat){
    var meta = catMeta[cat];
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.cat = cat;
    chip.innerHTML = '<span class="chip-glyph">'+meta.glyph+'</span>'+meta.label;
    filtersEl.appendChild(chip);
  });

  var activeCat = 'all';
  filtersEl.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    activeCat = chip.dataset.cat;
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function(c){
      c.classList.toggle('active', c === chip);
    });
    applyFilter();
  });

  function applyFilter(){
    pois.forEach(function(poi){
      var visible = (activeCat === 'all' || poi.cat === activeCat);
      var mk = markers[poi.id];
      if(visible){ if(!map.hasLayer(mk)) mk.addTo(map); }
      else { if(map.hasLayer(mk)) map.removeLayer(mk); }
    });
    renderVisibleList();
  }

  /* ---------------- Bascule de ville ---------------- */
  function activateCity(slug){
    var data = cityRegistry[slug];
    if(!data) return;

    if(typeof stopSpeech === 'function') stopSpeech();
    if(typeof stopBlink === 'function') stopBlink();
    if(typeof closeModal === 'function') closeModal();
    if(typeof clearRoute === 'function') clearRoute();
    if(typeof clearFictionalStart === 'function') clearFictionalStart();

    activeCitySlug = slug;
    try{ localStorage.setItem(ACTIVE_CITY_KEY, slug); } catch(e){}

    pois = data.pois;
    interestValues = pois.map(function(p){ return p.interest; });
    interestMin = Math.min.apply(null, interestValues);
    interestMax = Math.max.apply(null, interestValues);

    var brandText = document.getElementById('brand-text');
    if(brandText){ brandText.textContent = data.city; }

    createMarkers();
    map.setView([data.center.lat, data.center.lng], data.zoom || 12);

    activeCat = 'all';
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function(c){
      c.classList.toggle('active', c.dataset.cat === 'all');
    });
    applyFilter();

    var loadingEl = document.getElementById('app-loading');
    if(loadingEl){ loadingEl.classList.add('hidden'); }
  }

  /* ---------------- Modal (popup centré) ---------------- */
  var modalOverlay = document.getElementById('modal-overlay');
  var modalContent = document.getElementById('modal-content');
  var modalCloseBtn = document.getElementById('modal-close');

  function openModal(html){
    modalContent.innerHTML = html;
    modalOverlay.classList.remove('hidden');
  }
  function closeModal(){
    modalOverlay.classList.add('hidden');
    modalContent.innerHTML = '';
    stopSpeech();
  }
  modalCloseBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){
    if(e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal();
  });

  /* ---------------- Changer de ville ---------------- */
  var cityListFilter = 'online'; // 'online' ou 'local'

  function renderCityList(){
    var listEl = document.getElementById('city-list');
    if(!listEl) return;
    listEl.innerHTML = '';

    if(cityListFilter === 'online'){
      Object.keys(cityRegistry).forEach(function(slug){
        var c = cityRegistry[slug];
        if(!c.builtin) return;
        var li = document.createElement('li');
        li.className = 'city-item' + (slug === activeCitySlug ? ' active' : '');
        li.innerHTML =
          '<span class="city-name">' + c.city + '</span>' +
          '<span class="city-count">' + c.pois.length + ' lieu' + (c.pois.length > 1 ? 'x' : '') + '</span>' +
          (slug === activeCitySlug ? '<span class="city-check">✓</span>' : '');
        li.addEventListener('click', function(){
          if(slug !== activeCitySlug){ activateCity(slug); } else { closeModal(); }
        });
        listEl.appendChild(li);
      });

      Object.keys(onlineManifest).forEach(function(slug){
        if(cityRegistry[slug]) return; // déjà téléchargée, déjà listée ci-dessus
        var entry = onlineManifest[slug];
        var countLabel = (typeof entry.count === 'number')
          ? entry.count + ' lieu' + (entry.count > 1 ? 'x' : '')
          : '';
        var li = document.createElement('li');
        li.className = 'city-item city-item-online';
        li.innerHTML =
          '<span class="city-name">' + entry.city + '</span>' +
          '<span class="city-count">' + countLabel + '</span>';
        li.addEventListener('click', function(){ fetchOnlineCity(slug); });
        listEl.appendChild(li);
      });

      if(!listEl.children.length){
        listEl.innerHTML = '<li class="empty-hint">Aucune ville en ligne pour le moment.</li>';
      }
    } else {
      var localSlugs = Object.keys(cityRegistry).filter(function(slug){ return !cityRegistry[slug].builtin; });
      if(!localSlugs.length){
        listEl.innerHTML = '<li class="empty-hint">Aucune ville locale — charge un fichier JSON ci-dessous.</li>';
      }
      localSlugs.forEach(function(slug){
        var c = cityRegistry[slug];
        var li = document.createElement('li');
        li.className = 'city-item' + (slug === activeCitySlug ? ' active' : '');
        li.innerHTML =
          '<span class="city-name">' + c.city + '</span>' +
          '<span class="city-count">' + c.pois.length + ' lieu' + (c.pois.length > 1 ? 'x' : '') + '</span>' +
          (slug === activeCitySlug ? '<span class="city-check">✓</span>' : '');
        li.addEventListener('click', function(){
          if(slug !== activeCitySlug){ activateCity(slug); } else { closeModal(); }
        });
        listEl.appendChild(li);
      });
    }
  }

  function fetchOnlineCity(slug){
    var entry = onlineManifest[slug];
    if(!entry) return;
    showToast('Téléchargement de ' + entry.city + '…');
    fetch('villes/' + entry.file).then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(data){
      data.builtin = true;
      cityRegistry[slug] = data;
      activateCity(slug);
    }).catch(function(){
      showToast('Impossible de télécharger ' + entry.city + ' pour le moment.');
      var loadingEl = document.getElementById('app-loading');
      if(loadingEl && !loadingEl.classList.contains('hidden') && cityRegistry.hambourg){
        activateCity('hambourg'); // repli si l'échec survient pendant l'amorçage initial
      } else if(loadingEl){
        loadingEl.classList.add('hidden');
      }
    });
  }

  function handleCityFileInput(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ showToast('Fichier JSON invalide.'); return; }

      if(!data || !data.city || !data.center ||
         typeof data.center.lat !== 'number' || typeof data.center.lng !== 'number' ||
         !Array.isArray(data.pois) || !data.pois.length){
        showToast('Format inattendu — vérifie le fichier généré.');
        return;
      }
      data.zoom = typeof data.zoom === 'number' ? data.zoom : 12;
      data.builtin = false;

      var slug = slugify(data.city);
      cityRegistry[slug] = data;
      persistCities();
      cityListFilter = 'local';
      activateCity(slug);
      showToast(data.city + ' chargée (' + data.pois.length + ' lieux).');
    };
    reader.onerror = function(){ showToast('Impossible de lire ce fichier.'); };
    reader.readAsText(file);
  }

  function updateLoadJsonVisibility(){
    var box = document.getElementById('load-json-box');
    if(box){ box.style.display = (cityListFilter === 'local') ? '' : 'none'; }
  }

  function openCityPicker(){
    openModal(
      '<h2>Changer de ville</h2>' +
      '<div class="segmented" id="city-filter-toggle">' +
        '<button class="seg-btn' + (cityListFilter === 'online' ? ' active' : '') + '" data-filter="online">En ligne</button>' +
        '<button class="seg-btn' + (cityListFilter === 'local' ? ' active' : '') + '" data-filter="local">Local storage</button>' +
      '</div>' +
      '<ul id="city-list" class="city-list"></ul>' +
      '<div id="load-json-box">' +
        '<label class="link-btn" for="json-file-input">📂 Charger un fichier JSON</label>' +
        '<input type="file" id="json-file-input" accept="application/json,.json" style="display:none;">' +
        '<p class="modal-hint">Demande à Claude de générer le JSON d\'une nouvelle ville dans ce projet, puis charge-le ici.</p>' +
      '</div>'
    );
    renderCityList();
    updateLoadJsonVisibility();
    document.getElementById('json-file-input').addEventListener('change', handleCityFileInput);
    Array.prototype.forEach.call(document.querySelectorAll('#city-filter-toggle .seg-btn'), function(btn){
      btn.addEventListener('click', function(){
        cityListFilter = btn.dataset.filter;
        Array.prototype.forEach.call(document.querySelectorAll('#city-filter-toggle .seg-btn'), function(b){
          b.classList.toggle('active', b === btn);
        });
        renderCityList();
        updateLoadJsonVisibility();
      });
    });
  }

  document.getElementById('city-btn').addEventListener('click', openCityPicker);
  document.getElementById('brand-label').addEventListener('click', openCityPicker);

  /* ---------------- List (uniquement les lieux visibles à l'écran) ---------------- */
  var listEl = document.getElementById('poi-list');

  // Miniatures via l'API publique Wikipedia (thumbnail officiel de l'article, si disponible) —
  // simple lien direct vers l'image hébergée par Wikimedia, jamais téléchargée ni redistribuée.
  // Dégradation silencieuse vers le badge coloré si rien n'est trouvé.
  var thumbnailCache = {}; // poi.id -> URL (string) | null (déjà tenté, sans résultat)

  function applyThumbnail(poiId, url){
    if(!url) return;
    var slots = document.querySelectorAll('.thumb-slot[data-poi-id="' + poiId + '"]');
    Array.prototype.forEach.call(slots, function(slot){
      slot.innerHTML = '<img class="poi-thumb" src="' + url + '" alt="" loading="lazy">';
    });
  }

  function fetchWikiThumbnail(poi){
    if(poi.id in thumbnailCache){ applyThumbnail(poi.id, thumbnailCache[poi.id]); return; }
    thumbnailCache[poi.id] = null; // évite les requêtes en double pendant le chargement
    var title = encodeURIComponent(poi.name);

    function tryLang(lang, isRetry){
      fetch('https://' + lang + '.wikipedia.org/api/rest_v1/page/summary/' + title)
        .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(function(data){
          var url = (data.thumbnail && data.thumbnail.source) ? data.thumbnail.source : null;
          if(!url && !isRetry){ tryLang('en', true); return; }
          thumbnailCache[poi.id] = url;
          applyThumbnail(poi.id, url);
        })
        .catch(function(){
          if(!isRetry){ tryLang('en', true); }
        });
    }
    tryLang('fr', false);
  }

  function renderVisibleList(){
    var bounds = map.getBounds();
    var visiblePois = pois.filter(function(p){
      return bounds.contains([p.lat, p.lng]) && (activeCat === 'all' || p.cat === activeCat);
    }).sort(function(a,b){ return b.interest - a.interest; });

    listEl.innerHTML = '';
    if(!visiblePois.length){
      listEl.innerHTML = '<li class="empty-hint">Aucun lieu dans cette zone — dézoome ou déplace la carte.</li>';
    } else {
      visiblePois.forEach(function(poi){
        var meta = catMeta[poi.cat];
        var green = colorForInterest(poi.interest);
        var li = document.createElement('li');
        li.innerHTML =
          '<span class="pin-mini" style="background:'+green+'"><span>'+meta.glyph+'</span></span>' +
          '<span class="li-text">' +
            '<span class="li-tags">' +
              '<span class="stamp" style="color:'+meta.color+'">'+meta.label+'</span>' +
              '<span class="interest-tag" style="color:'+green+'">'+interestLabel(poi.interest)+'</span>' +
            '</span>' +
            '<h3>'+poi.name+'</h3>' +
            '<p>'+poi.teaser+'</p>' +
          '</span>' +
          '<span class="thumb-slot" data-poi-id="'+poi.id+'"></span>';
        li.addEventListener('click', function(){ openDetail(poi.id); });
        listEl.appendChild(li);
        fetchWikiThumbnail(poi);
      });
    }

    handleLabel.textContent = visiblePois.length + (visiblePois.length > 1 ? ' lieux visibles' : ' lieu visible');
  }

  /* ---------------- Sheet ---------------- */
  var sheet = document.getElementById('sheet');
  var handle = document.getElementById('sheet-handle');
  var handleLabel = document.getElementById('handle-label');

  function expandSheet(){
    sheet.classList.add('expanded');
    handle.setAttribute('aria-expanded','true');
  }
  function collapseSheet(){
    sheet.classList.remove('expanded');
    handle.setAttribute('aria-expanded','false');
  }

  handle.addEventListener('click', function(){
    if(sheet.classList.contains('expanded')) collapseSheet();
    else expandSheet();
  });

  map.on('moveend', renderVisibleList);

  Promise.all([
    fetch('villes/hambourg.json').then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(data){
      data.builtin = true;
      cityRegistry.hambourg = data;
    }).catch(function(){
      showToast('Impossible de charger les données de Hambourg — vérifie ta connexion.');
    }),
    fetch('villes/index.json').then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(list){
      (list || []).forEach(function(entry){
        var slug = slugify(entry.city);
        if(!cityRegistry[slug]){ onlineManifest[slug] = entry; }
      });
    }).catch(function(){ /* pas grave : Hambourg reste dispo, catalogue simplement absent */ })
  ]).then(function(){
    // Bug corrigé : l'ancienne version retombait sur Hambourg dès que la ville
    // sauvegardée n'était pas encore dans cityRegistry — ce qui est TOUJOURS
    // le cas au démarrage pour une ville du catalogue en ligne (elle n'est
    // téléchargée qu'à la demande). Elle ne testait donc jamais onlineManifest.
    if(cityRegistry[activeCitySlug]){
      activateCity(activeCitySlug);
    } else if(onlineManifest[activeCitySlug]){
      fetchOnlineCity(activeCitySlug);
    } else if(cityRegistry.hambourg){
      activateCity('hambourg');
    } else {
      showToast('Aucune ville disponible pour le moment.');
      var loadingEl = document.getElementById('app-loading');
      if(loadingEl){ loadingEl.classList.add('hidden'); }
    }
  });

  /* ---------------- Fiche POI (popup centré) ---------------- */
  var blinkingPin = null;

  function stopBlink(){
    if(blinkingPin){
      blinkingPin.classList.remove('blink');
      blinkingPin = null;
    }
  }
  map.on('movestart', stopBlink);

  function blinkMarker(poi){
    stopBlink();
    var mk = markers[poi.id];
    if(!mk) return;
    var el = mk.getElement();
    if(!el) return;
    var pin = el.querySelector('.pin');
    if(!pin) return;
    pin.classList.add('blink');
    blinkingPin = pin;
  }

  function openDetail(id){
    stopSpeech();
    var poi = pois.filter(function(p){ return p.id === id; })[0];
    if(!poi) return;
    var meta = catMeta[poi.cat];
    var green = colorForInterest(poi.interest);
    var photoUrl = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(poi.name + ' Hambourg');

    collapseSheet();

    openModal(
      '<span class="li-tags">' +
        '<span class="stamp" style="color:'+meta.color+'">'+meta.label+'</span>' +
        '<span class="interest-tag" style="color:'+green+'">'+interestLabel(poi.interest)+'</span>' +
        '<button class="listen-btn" id="listen-btn" aria-label="Écouter la description à voix haute"><span class="icon">▶</span><span class="listen-label">Écouter</span></button>' +
      '</span>' +
      '<h2>'+poi.name+'</h2>' +
      '<p class="desc">'+poi.desc+'</p>' +
      '<div class="link-row">' +
        '<a class="link-btn" href="'+photoUrl+'" target="_blank" rel="noopener">📷 Voir une photo</a>' +
        '<button class="link-btn" id="gemini-btn">✦ Demander à Gemini</button>' +
      '</div>' +
      '<p class="coords">'+poi.lat.toFixed(4)+'° N, '+poi.lng.toFixed(4)+'° E</p>'
    );

    var listenBtn = document.getElementById('listen-btn');
    if(listenBtn){
      listenBtn.addEventListener('click', function(){ toggleSpeech(poi); });
    }
    var geminiBtn = document.getElementById('gemini-btn');
    if(geminiBtn){
      geminiBtn.addEventListener('click', function(){ askGemini(poi); });
    }

    map.flyTo([poi.lat, poi.lng], 15.5, { duration: 0.6 });
    blinkMarker(poi);
  }

  /* ---------------- Réglages audio (popup centré) ---------------- */
  var settingsBtn = document.getElementById('settings-btn');

  settingsBtn.addEventListener('click', function(){
    openModal(
      '<h2>Réglages de lecture</h2>' +
      '<div class="audio-controls">' +
        '<div class="ctrl">' +
          '<label>Vitesse <span class="val" id="rate-val">'+speechRate.toFixed(1)+'x</span></label>' +
          '<input type="range" id="rate-slider" min="0.5" max="1.6" step="0.1" value="'+speechRate+'">' +
        '</div>' +
        '<div class="ctrl">' +
          '<label>Ton <span class="val" id="pitch-val">'+speechPitch.toFixed(1)+'</span></label>' +
          '<input type="range" id="pitch-slider" min="0.5" max="1.8" step="0.1" value="'+speechPitch+'">' +
        '</div>' +
      '</div>' +
      '<p class="token-notice">Token expiré<br>' +
        '<a href="https://github.com/settings/personal-access-tokens/18895724" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/18895724</a>' +
      '</p>'
    );

    var rateSlider = document.getElementById('rate-slider');
    var pitchSlider = document.getElementById('pitch-slider');
    rateSlider.addEventListener('input', function(){
      speechRate = parseFloat(rateSlider.value);
      document.getElementById('rate-val').textContent = speechRate.toFixed(1)+'x';
      previewVoiceSettings();
    });
    pitchSlider.addEventListener('input', function(){
      speechPitch = parseFloat(pitchSlider.value);
      document.getElementById('pitch-val').textContent = speechPitch.toFixed(1);
      previewVoiceSettings();
    });
  });

  /* ---------------- Text-to-speech ---------------- */
  var speaking = false;
  var speechRate = 0.98;
  var speechPitch = 1.0;
  var currentPoi = null;
  var audioPlayer = null; // lecture d'un fichier audio pré-enregistré, quand disponible

  if('speechSynthesis' in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  function updateListenButtonUI(){
    var btn = document.getElementById('listen-btn');
    if(!btn) return;
    btn.classList.toggle('active', speaking);
    btn.querySelector('.icon').textContent = speaking ? '■' : '▶';
    btn.querySelector('.listen-label').textContent = speaking ? 'Arrêter' : 'Écouter';
  }

  function stopSpeech(){
    if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
    if(audioPlayer){ audioPlayer.pause(); audioPlayer = null; }
    speaking = false;
    currentPoi = null;
    updateListenButtonUI();
  }

  function pickFrenchVoice(voices){
    var fr = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; });
    if(!fr.length) return null;
    // 1. Voix réseau Google — nettement meilleure qualité que les voix locales embarquées
    var google = fr.filter(function(v){ return /google/i.test(v.name) && v.localService === false; })[0];
    if(google) return google;
    // 2. N'importe quelle voix réseau en français
    var network = fr.filter(function(v){ return v.localService === false; })[0];
    if(network) return network;
    // 3. Repli : première voix française disponible, même locale
    return fr[0];
  }

  function speakWithSynthesis(poi){
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(poi.name + '. ' + poi.desc);
    utter.lang = 'fr-FR';
    var voices = window.speechSynthesis.getVoices();
    var frVoice = pickFrenchVoice(voices);
    if(frVoice) utter.voice = frVoice;
    utter.rate = speechRate;
    utter.pitch = speechPitch;
    utter.onend = function(){ speaking = false; currentPoi = null; updateListenButtonUI(); };
    utter.onerror = function(){ speaking = false; currentPoi = null; updateListenButtonUI(); };

    window.speechSynthesis.speak(utter);
    speaking = true;
    currentPoi = poi;
    updateListenButtonUI();
  }

  function speakPoi(poi){
    // Fichier audio pré-enregistré (voix neuronale de meilleure qualité) si ce lieu en a un.
    if(poi.audio){
      if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
      if(audioPlayer){ audioPlayer.pause(); }
      audioPlayer = new Audio(poi.audio);
      audioPlayer.playbackRate = speechRate; // le ton n'est pas ajustable sur un fichier pré-enregistré
      audioPlayer.onended = function(){ speaking = false; currentPoi = null; audioPlayer = null; updateListenButtonUI(); };
      audioPlayer.onerror = function(){
        showToast("Fichier audio introuvable, lecture via la synthèse vocale à la place.");
        audioPlayer = null;
        speakWithSynthesis(poi);
      };
      audioPlayer.play().catch(function(){
        audioPlayer = null;
        speakWithSynthesis(poi);
      });
      speaking = true;
      currentPoi = poi;
      updateListenButtonUI();
      return;
    }
    speakWithSynthesis(poi);
  }

  // Le Web Speech API ne permet pas de changer la vitesse/le ton d'une lecture
  // déjà lancée : on relance donc la lecture depuis le début avec les nouveaux réglages.
  // (Pour un fichier pré-enregistré, la vitesse s'ajuste en direct sans relancer.)
  var restartTimer = null;
  function restartSpeechIfPlaying(poi){
    if(audioPlayer){ audioPlayer.playbackRate = speechRate; return; }
    clearTimeout(restartTimer);
    restartTimer = setTimeout(function(){ speakPoi(poi); }, 350);
  }

  var VOICE_PREVIEW_PHRASE = "Ajustez confortablement la vitesse et le ton de ma voix.";
  var previewTimer = null;
  function previewVoiceSettings(){
    if(!('speechSynthesis' in window)) return;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function(){
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(VOICE_PREVIEW_PHRASE);
      utter.lang = 'fr-FR';
      var frVoice = pickFrenchVoice(window.speechSynthesis.getVoices());
      if(frVoice) utter.voice = frVoice;
      utter.rate = speechRate;
      utter.pitch = speechPitch;
      window.speechSynthesis.speak(utter);
    }, 350);
  }

  function toggleSpeech(poi){
    if(!poi.audio && !('speechSynthesis' in window)){
      showToast("La lecture audio n'est pas prise en charge par ce navigateur.");
      return;
    }
    if(speaking){ stopSpeech(); return; }
    speakPoi(poi);
  }

  /* ---------------- Ask Gemini ---------------- */
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok) resolve(); else reject(new Error('execCommand a échoué'));
      } catch(err){
        reject(err);
      }
    });
  }

  function askGemini(poi){
    var question = 'Peux-tu me donner des informations intéressantes, quelques anecdotes et de bons conseils de visite sur '+poi.name+' à Hambourg ?';

    // On copie D'ABORD, tant que cette page a encore le focus — ouvrir Gemini avant
    // ferait perdre le focus et la copie échouerait silencieusement (presse-papiers vide).
    copyText(question).then(function(){
      showToast('Question copiée — colle-la dans Gemini (appui long → Coller).');
    }).catch(function(){
      showToast('Copie impossible ici — pose ta question directement dans Gemini.');
    }).then(function(){
      window.open('https://gemini.google.com/app', '_blank');
    });
  }

  /* ---------------- Toast ---------------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.add('hidden'); }, 4200);
  }

  /* ---------------- Geolocation ---------------- */
  var locateBtn = document.getElementById('locate-btn');
  var userMarker = null;
  var watchId = null;
  var firstFix = true;
  var NEIGHBORHOOD_ZOOM = 15;

  var userIcon = L.divIcon({
    className:'user-marker',
    html:'<span class="user-dot"><span class="ping"></span></span>',
    iconSize:[18,18], iconAnchor:[9,9]
  });

  function startTracking(){
    if(!('geolocation' in navigator)){
      showToast('Géolocalisation non disponible sur ce navigateur.');
      return;
    }
    locateBtn.classList.add('active');
    firstFix = true;
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy:true, maximumAge:5000, timeout:15000
    });
  }

  function stopTracking(){
    if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    locateBtn.classList.remove('active');
  }

  var GEOLOCATION_CITY_RADIUS_KM = 40; // au-delà, on considère que la position réelle n'a rien à voir avec la ville affichée

  function isNearActiveCity(latlng){
    var data = cityRegistry[activeCitySlug];
    if(!data || !data.center) return true; // par prudence, ne bloque rien si l'info manque
    var distKm = haversineMeters(latlng, data.center) / 1000;
    return distKm <= GEOLOCATION_CITY_RADIUS_KM;
  }

  function onPosition(pos){
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    if(!userMarker){
      userMarker = L.marker([lat,lng], { icon:userIcon, zIndexOffset:1000 }).addTo(map);
    } else {
      userMarker.setLatLng([lat,lng]);
    }
    if(firstFix){
      if(isNearActiveCity({lat:lat, lng:lng})){
        map.flyTo([lat,lng], NEIGHBORHOOD_ZOOM, { duration:0.7 });
      } else {
        var cityName = cityRegistry[activeCitySlug] ? cityRegistry[activeCitySlug].city : 'cette ville';
        showToast('Ta position réelle est loin de ' + cityName + ' — la carte ne bouge pas. Appui long pour choisir un point de départ ici.');
      }
      firstFix = false;
    }
  }

  function onPositionError(err){
    var msg = 'Localisation indisponible. Astuce : appui long sur la carte pour choisir un point de départ.';
    if(err.code === err.PERMISSION_DENIED){
      msg = 'Localisation refusée — ou fais un appui long sur la carte pour choisir un point de départ à la main.';
    } else if(err.code === err.POSITION_UNAVAILABLE){
      msg = 'Position introuvable — ou fais un appui long sur la carte pour choisir un point de départ.';
    } else if(err.code === err.TIMEOUT){
      msg = 'La localisation prend trop de temps, réessayez.';
    }
    showToast(msg);
    stopTracking();
  }

  // Chaque appui recentre et zoome au niveau quartier — uniquement si cette position
  // est bien dans la zone de la ville affichée. Le premier appui démarre aussi le
  // suivi en direct (point bleu), qui reste actif en arrière-plan.
  // Un tap ici abandonne aussi un éventuel point de départ fictif au profit de la vraie position.
  locateBtn.addEventListener('click', function(){
    clearFictionalStart();
    if(watchId === null){
      startTracking();
    } else if(userMarker){
      var latlng = userMarker.getLatLng();
      if(isNearActiveCity(latlng)){
        map.flyTo(latlng, NEIGHBORHOOD_ZOOM, { duration:0.6 });
      } else {
        var cityName = cityRegistry[activeCitySlug] ? cityRegistry[activeCitySlug].city : 'cette ville';
        showToast('Ta position réelle est loin de ' + cityName + ' — la carte ne bouge pas.');
      }
    }
  });

  /* ---------------- Point de départ fictif (appui long sur la carte) ---------------- */
  var fictionalStart = null;       // {lat,lng} actif une fois confirmé
  var fictionalStartMarker = null; // drapeau posé sur la carte une fois confirmé
  var positioningActive = false;   // mode "on déplace la carte sous le drapeau fixe"

  var startPointBar = document.getElementById('start-point-bar');
  var startPointText = document.getElementById('start-point-text');
  var startPointConfirmBtn = document.getElementById('start-point-confirm');
  var startPointCancelBtn = document.getElementById('start-point-cancel');
  var centerFlagEl = document.getElementById('center-flag');

  function showStartPointBar(text, confirmLabel){
    startPointText.textContent = text;
    startPointConfirmBtn.textContent = confirmLabel;
    startPointBar.classList.remove('hidden');
  }
  function hideStartPointBar(){
    startPointBar.classList.add('hidden');
  }

  // Appui long : centre la carte sur le point touché, puis affiche un drapeau fixe
  // au centre de l'écran — l'utilisateur affine la position en déplaçant la carte
  // en dessous (comme un dépose-épingle classique), plutôt qu'en glissant le drapeau.
  function placeFlag(latlng){
    if(fictionalStartMarker){ map.removeLayer(fictionalStartMarker); fictionalStartMarker = null; }
    map.panTo(latlng, { animate:true, duration:0.35 });
    positioningActive = true;
    centerFlagEl.classList.remove('hidden');

    showStartPointBar("Déplace la carte pour ajuster, puis confirme", 'Confirmer');
    startPointConfirmBtn.onclick = confirmPositioning;
    startPointCancelBtn.onclick = cancelPositioning;
  }

  function confirmPositioning(){
    var center = map.getCenter();
    fictionalStart = { lat: center.lat, lng: center.lng };
    positioningActive = false;
    centerFlagEl.classList.add('hidden');
    hideStartPointBar();
    dropConfirmedFlag(fictionalStart);
    planAndDrawRoute(parseInt(routeSlider.value, 10));
  }

  function cancelPositioning(){
    positioningActive = false;
    centerFlagEl.classList.add('hidden');
    hideStartPointBar();
  }

  function dropConfirmedFlag(latlng){
    var icon = L.divIcon({
      className:'start-flag-marker',
      html:'<span class="start-flag">🚩</span>',
      iconSize:[30,30], iconAnchor:[6,28]
    });
    fictionalStartMarker = L.marker(latlng, { icon:icon, zIndexOffset:1200 }).addTo(map);
    fictionalStartMarker.on('click', function(){
      showStartPointBar('Retirer ce point de départ ?', 'Retirer');
      startPointConfirmBtn.onclick = function(){ clearFictionalStart(); hideStartPointBar(); };
      startPointCancelBtn.onclick = hideStartPointBar;
    });
  }

  function clearFictionalStart(){
    fictionalStart = null;
    positioningActive = false;
    centerFlagEl.classList.add('hidden');
    if(fictionalStartMarker){ map.removeLayer(fictionalStartMarker); fictionalStartMarker = null; }
    hideStartPointBar();
  }

  // Détection d'appui long : Leaflet ne relaie pas fiablement les événements tactiles
  // vers map.on('mousedown'), donc on écoute directement le DOM du conteneur de carte,
  // en gérant explicitement tactile ET souris.
  var LONG_PRESS_MS = 550;
  var LONG_PRESS_TOLERANCE_PX = 12;

  function eventToLatLng(e){
    var pt = (e.touches && e.touches.length) ? e.touches[0] : e;
    return map.mouseEventToLatLng(pt);
  }

  (function setupLongPress(){
    var mapContainer = map.getContainer();
    var timer = null;
    var startPoint = null;

    function onMove(e){
      if(!startPoint) return;
      var p = map.latLngToContainerPoint(eventToLatLng(e));
      if(p.distanceTo(startPoint) > LONG_PRESS_TOLERANCE_PX){ onEnd(); }
    }
    function onEnd(){
      if(timer){ clearTimeout(timer); timer = null; }
      startPoint = null;
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('touchend', onEnd);
      document.removeEventListener('touchcancel', onEnd);
      document.removeEventListener('mouseup', onEnd);
    }
    function onStart(e){
      if(e.touches && e.touches.length > 1) return; // laisser le pincer-zoomer tranquille
      var latlng = eventToLatLng(e);
      startPoint = map.latLngToContainerPoint(latlng);
      timer = setTimeout(function(){
        timer = null;
        onEnd();
        placeFlag(latlng);
      }, LONG_PRESS_MS);
      document.addEventListener('touchmove', onMove, { passive:true });
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchend', onEnd);
      document.addEventListener('touchcancel', onEnd);
      document.addEventListener('mouseup', onEnd);
    }

    mapContainer.addEventListener('touchstart', onStart, { passive:true });
    mapContainer.addEventListener('mousedown', onStart);
  })();

  map.on('contextmenu', function(e){ e.originalEvent.preventDefault(); });

  /* ---------------- Parcours (1h / 2h / 3h / 4h) ---------------- */
  var routeLayer = null;
  var activeRouteMinutes = null;
  var WALK_SPEED_M_PER_MIN = 80; // ~4.8 km/h, rythme touriste
  var VISIT_MINUTES = 18;        // temps moyen passé sur place par lieu

  function haversineMeters(a, b){
    var R = 6371000;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(b.lat - a.lat);
    var dLng = toRad(b.lng - a.lng);
    var lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
  }

  // Priorité à l'intérêt : on essaie toujours le lieu le mieux noté restant en premier ;
  // s'il ne rentre pas dans le temps restant, on tente le suivant, etc.
  function planRoute(start, budgetMinutes){
    var remaining = budgetMinutes;
    var current = { lat:start.lat, lng:start.lng };
    var candidates = pois.slice().sort(function(a,b){ return b.interest - a.interest; });
    var used = {};
    var route = [];

    while(true){
      var picked = null, pickedCost = 0;
      for(var i=0;i<candidates.length;i++){
        var poi = candidates[i];
        if(used[poi.id]) continue;
        var distM = haversineMeters(current, poi);
        var cost = (distM / WALK_SPEED_M_PER_MIN) + VISIT_MINUTES;
        if(cost <= remaining){ picked = poi; pickedCost = cost; break; }
      }
      if(!picked) break;
      route.push(picked);
      used[picked.id] = true;
      remaining -= pickedCost;
      current = { lat: picked.lat, lng: picked.lng };
    }
    return route;
  }

  function clearRoute(){
    if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
    activeRouteMinutes = null;
    var clearBtn = document.getElementById('route-clear-btn');
    if(clearBtn){ clearBtn.classList.add('hidden'); }
  }

  function drawRoute(start, route, walkingLatLngs){
    clearRoute();
    if(!route.length) return;
    routeLayer = L.layerGroup().addTo(map);

    var lineLatLngs;
    if(walkingLatLngs && walkingLatLngs.length > 1){
      lineLatLngs = walkingLatLngs; // vrai tracé le long des rues
    } else {
      lineLatLngs = [[start.lat, start.lng]];
      route.forEach(function(poi){ lineLatLngs.push([poi.lat, poi.lng]); }); // repli : ligne droite
    }

    L.polyline(lineLatLngs, {
      color:'#16232F', weight:4, opacity:.85,
      dashArray: walkingLatLngs ? null : '1,10', // pointillés seulement pour le repli ligne droite
      lineCap:'round'
    }).addTo(routeLayer);

    route.forEach(function(poi, idx){
      var icon = L.divIcon({
        className:'route-stop',
        html:'<span class="route-stop-num">'+(idx+1)+'</span>',
        iconSize:[26,26], iconAnchor:[13,13]
      });
      var m = L.marker([poi.lat, poi.lng], { icon:icon, zIndexOffset:900 }).addTo(routeLayer);
      m.on('click', function(){ openDetail(poi.id); });
    });

    var boundsPoints = lineLatLngs.concat(route.map(function(p){ return [p.lat, p.lng]; }));
    map.fitBounds(L.latLngBounds(boundsPoints), { padding:[50,90] });
  }

  // Serveur public OSRM (FOSSGIS), gratuit et sans clé — le même moteur que celui
  // utilisé sur openstreetmap.org pour ses propres itinéraires piétons.
  var OSRM_FOOT_ENDPOINT = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/';

  function fetchWalkingGeometry(start, route){
    var points = [{lat:start.lat, lng:start.lng}].concat(route);
    var coordStr = points.map(function(p){ return p.lng + ',' + p.lat; }).join(';');
    var url = OSRM_FOOT_ENDPOINT + coordStr + '?overview=full&geometries=geojson';
    var opts = {};
    if(window.AbortSignal && AbortSignal.timeout){ opts.signal = AbortSignal.timeout(10000); }

    return fetch(url, opts).then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(data){
      if(data.code !== 'Ok' || !data.routes || !data.routes[0]){ throw new Error('réponse OSRM invalide'); }
      var r0 = data.routes[0];
      var latlngs = r0.geometry.coordinates.map(function(c){ return [c[1], c[0]]; }); // geojson [lng,lat] -> Leaflet [lat,lng]
      return { latlngs: latlngs, distanceM: r0.distance, durationS: r0.duration };
    });
  }

  function getUserPositionForRoute(callback){
    if(fictionalStart){ callback(L.latLng(fictionalStart.lat, fictionalStart.lng)); return; }

    function useIfNearCity(latlng){
      if(!isNearActiveCity(latlng)){
        var cityName = cityRegistry[activeCitySlug] ? cityRegistry[activeCitySlug].city : 'cette ville';
        showToast('Ta position GPS est loin de ' + cityName + ' — fais un appui long sur la carte pour choisir un point de départ ici.');
        return;
      }
      callback(latlng);
    }

    if(userMarker){ useIfNearCity(userMarker.getLatLng()); return; }
    if(!('geolocation' in navigator)){
      showToast('Géolocalisation non disponible — fais un appui long sur la carte pour choisir un point de départ.');
      return;
    }
    showToast('Localisation en cours…');
    navigator.geolocation.getCurrentPosition(function(pos){
      var latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
      if(watchId === null){ startTracking(); } // suivi en direct pour le reste du parcours
      useIfNearCity(latlng);
    }, onPositionError, { enableHighAccuracy:true, timeout:15000, maximumAge:5000 });
  }

  function formatDuration(minutes){
    var h = Math.floor(minutes / 60);
    var m = minutes % 60;
    return m === 0 ? h + 'h' : h + 'h' + (m < 10 ? '0' : '') + m;
  }

  var routeSlider = document.getElementById('route-slider');
  var routeWalker = document.getElementById('route-walker');
  var routeSliderLabel = document.getElementById('route-slider-label');
  var routeClearBtn = document.getElementById('route-clear-btn');

  var ROUTE_TRACK_LENGTH_PX = 210; // doit correspondre à la largeur de #route-slider avant rotation (CSS)

  function updateWalkerPosition(){
    var min = parseFloat(routeSlider.min), max = parseFloat(routeSlider.max), val = parseFloat(routeSlider.value);
    var percent = (val - min) / (max - min);
    var half = 14;
    var topPx = half + percent * (ROUTE_TRACK_LENGTH_PX - half * 2);
    routeWalker.style.top = topPx + 'px';
  }

  routeSlider.addEventListener('input', function(){
    routeSliderLabel.textContent = formatDuration(parseInt(routeSlider.value, 10));
    updateWalkerPosition();
  });

  // Le parcours n'est (re)calculé qu'au relâchement, pas pendant le glissement,
  // pour éviter les à-coups liés à l'appel réseau vers OSRM.
  function planAndDrawRoute(minutes){
    getUserPositionForRoute(function(start){
      var route = planRoute(start, minutes);
      if(!route.length){
        showToast('Aucun lieu ne rentre dans ce créneau depuis ta position.');
        return;
      }

      fetchWalkingGeometry(start, route).then(function(geo){
        drawRoute(start, route, geo.latlngs);
        activeRouteMinutes = minutes;
        routeClearBtn.classList.remove('hidden');
        var km = (geo.distanceM / 1000).toFixed(1);
        var mins = Math.round(geo.durationS / 60);
        showToast('Parcours ' + formatDuration(minutes) + ' : ' + route.length + ' lieu' + (route.length > 1 ? 'x' : '') + ', ' + km + ' km à pied (' + mins + ' min de marche réelle).');
      }).catch(function(){
        drawRoute(start, route, null);
        activeRouteMinutes = minutes;
        routeClearBtn.classList.remove('hidden');
        var totalKm = 0, prev = start;
        route.forEach(function(poi){ totalKm += haversineMeters(prev, poi) / 1000; prev = poi; });
        showToast('Parcours ' + formatDuration(minutes) + ' : ' + route.length + ' lieu' + (route.length > 1 ? 'x' : '') + ', ~' + totalKm.toFixed(1) + ' km à vol d\'oiseau (itinéraire piéton indisponible pour le moment).');
      });
    });
  }

  routeSlider.addEventListener('change', function(){
    planAndDrawRoute(parseInt(routeSlider.value, 10));
  });

  routeClearBtn.addEventListener('click', clearRoute);
  window.addEventListener('resize', updateWalkerPosition);
  updateWalkerPosition();
  routeSliderLabel.textContent = formatDuration(parseInt(routeSlider.value, 10));

  /* ---------------- Service worker (offline app shell) ---------------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* pas grave si indisponible */ });
    });
  }

})();
</script>
</body>
